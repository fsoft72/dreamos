# Bring the display up at a large resolution even when the (virtual) GPU's
# EDID does not advertise one - e.g. QEMU/GTK, which otherwise pins X to
# the 720x400 VGA console size. "modesetting" is the built-in KMS driver
# and covers Intel / AMD / nouveau / virtio / QXL / VMware. On a laptop
# whose panel cannot do a listed mode, X falls through to a supported one;
# a >1080p panel is capped at 1920x1080 - delete this file for native res.

Section "Device"
    Identifier "GPU0"
    Driver "modesetting"
    Option "ModeValidation" "AllowNonEdidModes"
EndSection

Section "Monitor"
    Identifier "Monitor0"
    Modeline "1920x1080" 173.00 1920 2048 2248 2576 1080 1083 1088 1120 -hsync +vsync
    Modeline "1600x900"  118.25 1600 1696 1856 2112  900  903  908  934 -hsync +vsync
    Modeline "1366x768"   85.50 1366 1436 1579 1792  768  771  774  798 -hsync +vsync
    Modeline "1280x800"   83.50 1280 1352 1480 1680  800  803  809  831 -hsync +vsync
    Option "PreferredMode" "1920x1080"
EndSection

Section "Screen"
    Identifier "Screen0"
    Device "GPU0"
    Monitor "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1920x1080" "1600x900" "1366x768" "1280x800"
    EndSubSection
EndSection
