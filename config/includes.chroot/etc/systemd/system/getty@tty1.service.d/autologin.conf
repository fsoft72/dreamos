# Live session: auto-log the live user in on tty1. The account is created
# at boot by live-config from the `username=user` kernel parameter.
# On an installed system the live user no longer exists, so agetty simply
# falls back to a normal login prompt here.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin user --noclear %I $TERM
